# Agentic OS configuration (ADR-0010).
# The single source of truth for every setting that is not a secret.
# Managed by `aos config` and System Settings; comments and hand-edits are kept.
# Secrets (the OpenAI key, the JWT signing key) live in /var/lib/aos/, never here.

# The model every Task runs on, such as gpt-5.6-terra.
model: gpt-5.6-terra
# How hard the model thinks; the values a model accepts differ (see models.yaml). The wire values are none, minimal, low, medium, high, xhigh or max.
reasoning_effort: ""
# How bold Agents are: auto, confirm-risky or confirm-all.
autonomy: confirm-risky
# How many Tasks run at once (1-16).
max_tasks: 3
# How many times a model call is retried (0-20).
max_retries: 3
# Per-Task Cost Limit in USD; 0 means none.
task_cost_limit_usd: 0
# Daily Cost Limit in USD; 0 means none.
daily_cost_limit_usd: 0
# How long the Trash keeps an item, in days (1-3650).
trash_retention_days: 30
# Trash size cap in GB (1-1024).
trash_max_gb: 5
# The Machine's Mode: ui (the Desktop, reached over the network behind a password) or cli (the control socket only, no web UI). (startup-only)
mode: ui
# OpenAI-compatible API base URL; empty uses OpenAI's own. Decides where the API key is sent. (startup-only)
base_url: ""
# Refuse to start when the kernel has no Landlock, rather than run Agents under policy checks only. (startup-only)
require_landlock: false
# Where Agents may write: home (only /home/aos, the Compose default) or host (all of / minus the Protected list on a native install, ADR-0004). (startup-only)
filesystem: home
# Whether the Browser app is available (ui Mode only). `sudo aos browser install` fetches Chromium's headless shell and sets this; `aos browser remove` clears it (M6.11, ADR-0008). (startup-only)
include_browser: false
# Whether the Machine runs in Root Mode: the Root Realm, where Agents, the Terminal and Finder act as root and Protected Paths are not enforced (M7). Never set here directly — `aos root on` / `aos root off` (or the System Settings switch) change it behind a warning and a password, and restart AOS into the new Realm. (startup-only)
root_mode: false
