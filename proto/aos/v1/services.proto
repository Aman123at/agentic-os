syntax = "proto3";

package aos.v1;

import "aos/v1/types.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Aman123at/agentic-os/gen/go/aos/v1;aosv1";

// ---------------------------------------------------------------- Auth (ADR-0007)

service AuthService {
  // Signs the one user in with a username and password. The access token is
  // held in memory and the refresh token in localStorage (ADR-0007); both
  // travel in headers, never cookies.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Rotates a refresh token: the old one is spent and a new pair returned.
  // Replaying a spent token revokes the whole family.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Mints a single-use, 30-second ticket for a browser load that cannot send a
  // header (a WebSocket, an <img>/<video>, a PDF range, a download). The caller
  // must already be authenticated.
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  // Replaces the signed-in user's password with one they chose (the forced
  // first change, or a later one). Twelve-character minimum. It signs every
  // other session out and returns the caller a fresh pair, so the session it was
  // called from stays alive without a re-login (ADR-0007, M6.5).
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Ends the caller's refresh family, so this sign-in and any it rotated into
  // stop working. The Desktop also closes the streams and WebSockets the
  // session authorised (M6.5).
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Creates the one account with a system-generated password that must be
  // changed on first sign-in. It is the account-creation moment `aos mode ui`
  // runs, so it is refused over the network (public bind) and served only over
  // the local control socket, and it refuses once an account exists (M6.5).
  rpc CreateInitialUser(CreateInitialUserRequest) returns (CreateInitialUserResponse);
}

message SignInRequest {
  string username = 1;
  string password = 2;
}
message SignInResponse {
  string access_token = 1;
  string refresh_token = 2;
  // The account still holds a system-generated password: the Desktop forces a
  // change before the shell loads.
  bool must_change_password = 3;
}

message RefreshRequest {
  string refresh_token = 1;
}
message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2;
  // Carried so a reload during the forced first change returns to it instead of
  // slipping into the shell.
  bool must_change_password = 3;
}

message CreateTicketRequest {}
message CreateTicketResponse {
  string ticket = 1;
}

message ChangePasswordRequest {
  string new_password = 1;
}
message ChangePasswordResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message SignOutRequest {
  string refresh_token = 1;
}
message SignOutResponse {}

message CreateInitialUserRequest {
  string username = 1;
  string password = 2;
}
message CreateInitialUserResponse {}

// ---------------------------------------------------------------- Tasks

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc SendFollowUp(SendFollowUpRequest) returns (SendFollowUpResponse);
  // Answers the question of a Task awaiting the user after ask_user.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ResumeTask(ResumeTaskRequest) returns (ResumeTaskResponse);
  rpc StopAll(StopAllRequest) returns (StopAllResponse);
  // Removes a Task and its steps, Approvals and grants. Refused while the Task
  // is queued, running or waiting: cancel it first. The Audit Log keeps its
  // record (it is append-only).
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  // The files a Task changed with its Tools, each with its before-image: the
  // content it had before the Task first changed it (M8.11).
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse);
  // One changed file's before-image.
  rpc GetBefore(GetBeforeRequest) returns (GetBeforeResponse);
  // Records what the user kept of a Task's change to a file in Change Review
  // (M8.12): the file is compared with this from now on.
  rpc ReviewChange(ReviewChangeRequest) returns (ReviewChangeResponse);
  // Discards what is left of a Task's change to a file: puts back what it is
  // compared with, or moves it to the Trash if that is "did not exist". As
  // the Realm's user, audited; a Sensitive System File needs confirming.
  rpc DiscardChange(DiscardChangeRequest) returns (DiscardChangeResponse);
}

message CreateTaskRequest {
  string prompt = 1;
  // Unspecified uses the configured Autonomy.
  Autonomy autonomy = 2;
  bool interactive = 3;
  // Set when the Task is started from Code's Agent sidebar (M8.11): the
  // Agent is told where the user is working, and the Task belongs to the
  // Workspace.
  EditorContext editor = 4;
}

// EditorContext is what Code tells the Agent about where the user is working
// (M8.11).
message EditorContext {
  // The Workspace's folder.
  string workspace = 1;
  // The file in front, if any.
  string active_file = 2;
  // Text the user added to the chat from the file in front (⌘L), capped at
  // 16 KiB, and the lines it spans.
  string selection = 3;
  int32 selection_start_line = 4;
  int32 selection_end_line = 5;
  // Every file open in the window.
  repeated string open_files = 6;
}
message CreateTaskResponse {
  Task task = 1;
}

message ListTasksRequest {
  int32 limit = 1;
  // Only the Tasks started from Code on this Workspace folder (M8.11).
  string workspace = 2;
}
message ListTasksResponse {
  repeated Task tasks = 1;
}

message GetTaskRequest {
  string id = 1;
}
message GetTaskResponse {
  Task task = 1;
  repeated TaskStep steps = 2;
  repeated Approval approvals = 3;
}

message SendFollowUpRequest {
  string id = 1;
  string text = 2;
  // Whether someone can answer Approvals and questions from now on.
  bool interactive = 3;
  // Where the user is working now, for a Follow-up from Code (M8.11).
  EditorContext editor = 4;
}
message SendFollowUpResponse {
  Task task = 1;
}

message AnswerQuestionRequest {
  string id = 1;
  string text = 2;
}
message AnswerQuestionResponse {}

message CancelTaskRequest {
  string id = 1;
}
message CancelTaskResponse {}

message ResumeTaskRequest {
  string id = 1;
  bool interactive = 2;
}
message ResumeTaskResponse {
  Task task = 1;
}

message StopAllRequest {}
message StopAllResponse {
  int32 cancelled = 1;
}

message DeleteTaskRequest {
  string id = 1;
}
message DeleteTaskResponse {}

// TaskFileChange is a file a Task changed with its Tools (M8.11). The first
// change keeps what the file was before; later ones by the same Task don't.
message TaskFileChange {
  string path = 1;
  // The Tool whose call first changed it: write_file, edit_file, move, copy
  // or delete.
  string tool = 2;
  // False when the Task created the file: it did not exist before.
  bool existed = 3;
  // It was a folder (moved or deleted): nothing to compare, and no content kept.
  bool folder = 4;
  // Its size before.
  int64 size = 5;
  // Whether the before-image was kept. Files over 64 MiB are not.
  bool kept = 6;
  // Too big to compare line by line (over 4 MiB), or not text: it can be kept
  // or put back whole, not hunk by hunk.
  bool whole = 7;
  google.protobuf.Timestamp changed_at = 8;
  // Change Review (M8.12): the file on disk still differs from what it is
  // compared with — the before-image, with what the user kept — so something
  // is left to decide. Set by ListChanges.
  bool pending = 9;
  // The user kept some of the change, so the file is compared with the
  // before-image as they left it, not as it was.
  bool reviewed = 10;
  // Whether what it is compared with exists; false while the Task's
  // creating it is undecided, or once its deleting it is kept.
  bool base_exists = 11;
}
message ListChangesRequest {
  string task_id = 1;
}
message ListChangesResponse {
  repeated TaskFileChange changes = 1;
}
message GetBeforeRequest {
  string task_id = 1;
  string path = 2;
}
message GetBeforeResponse {
  TaskFileChange change = 1;
  // What Change Review compares the file with: its content before the Task
  // changed it, with the hunks the user kept. Empty when that does not exist
  // (change.base_exists), was a folder, or is compared whole.
  bytes content = 2;
}
message ReviewChangeRequest {
  string task_id = 1;
  string path = 2;
  // What to compare the file with from now on: base, or "does not exist"
  // when gone; or, with keep_all, the file as it is now on disk.
  bytes base = 3;
  bool gone = 4;
  bool keep_all = 5;
}
message ReviewChangeResponse {
  TaskFileChange change = 1;
}
message DiscardChangeRequest {
  string task_id = 1;
  string path = 2;
  bool confirm_sensitive = 3;
}
message DiscardChangeResponse {
  TaskFileChange change = 1;
}

// ---------------------------------------------------------------- Approvals

service ApprovalService {
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);
  rpc Decide(DecideRequest) returns (DecideResponse);
}

message ListPendingRequest {
  // Empty lists pending Approvals of every Task.
  string task_id = 1;
}
message ListPendingResponse {
  repeated Approval approvals = 1;
}

message DecideRequest {
  string approval_id = 1;
  ApprovalDecision decision = 2;
}
message DecideResponse {
  Approval approval = 1;
}

// ---------------------------------------------------------------- Events

service EventService {
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

message SubscribeRequest {
  // Empty subscribes to every Task.
  string task_id = 1;
}

message SubscribeResponse {
  Event event = 1;
  // Set on the first message only: this subscription's id, which
  // CodeService.OpenWorkspace takes so a Code window's changes ride this
  // stream instead of holding a connection of their own (M8.2).
  string subscription_id = 2;
}

message Event {
  google.protobuf.Timestamp time = 1;
  oneof kind {
    TaskChanged task_changed = 2;
    TaskStepChanged task_step = 3;
    TextDelta text_delta = 4;
    ApprovalChanged approval = 5;
    DownloadProgress download_progress = 6;
    Notification notification = 7;
    ServiceChanged service_changed = 8;
    ReplayProgress replay_progress = 9;
    OpenInDesktop open_in_desktop = 10;
    DesktopStateChanged desktop_state = 11;
    // Only to the subscription that opened the Workspace (M8.2).
    WorkspaceChanged workspace = 12;
  }
}

// A tab saved the Desktop's state. Other tabs adopt the preferences in it
// (theme, wallpaper, Liquid Glass, shortcuts); the window layout stays per tab
// (PLAN.md §4.3). `origin` is the id of the tab that saved, so it can ignore
// its own event.
message DesktopStateChanged {
  string state = 1;
  string origin = 2;
}

// An Agent asks the Desktop to show a file or folder (the open_in_desktop Tool),
// or an app (the Browser Tools).
message OpenInDesktop {
  string task_id = 1;
  string path = 2;
  bool dir = 3;
  // An app to open (or bring forward) instead of a path: "browser" when an
  // Agent starts using the Browser (PLAN.md M5.3).
  string app = 4;
}

message ServiceChanged {
  ServiceInfo service = 1;
  bool removed = 2;
}

message ReplayProgress {
  ReplayStatus status = 1;
}

message TaskChanged {
  Task task = 1;
  // Set when the Task was deleted, so every tab drops it (mirrors
  // ServiceChanged.removed).
  bool removed = 2;
}

message TaskStepChanged {
  TaskStep step = 1;
}

message TextDelta {
  string task_id = 1;
  string step_id = 2;
  string delta = 3;
}

message ApprovalChanged {
  Approval approval = 1;
}

message DownloadProgress {
  string task_id = 1;
  string step_id = 2;
  string url = 3;
  string path = 4;
  int64 bytes = 5;
  // -1 when unknown.
  int64 total = 6;
}

message Notification {
  string title = 1;
  string body = 2;
  string task_id = 3;
  // Set when an Agent proposes a Memory; SettingsService.AcceptMemory saves it.
  string memory_id = 4;
  // Notifications are kept until dismissed (SystemService.ListNotifications).
  string id = 5;
  google.protobuf.Timestamp created_at = 6;
  // Set on the event sent when the notification is dismissed, so every tab drops it.
  bool dismissed = 7;
  // Set when an Agent offers a page a program in the Machine serves on this
  // port: the Desktop shows an Open button, since browsers block pop-ups
  // that no click started.
  int32 port = 8;
}

// ---------------------------------------------------------------- Files and Trash

service FileService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  // Makes a new folder, and any missing folders above it (M8.3). Something
  // already at the path is AlreadyExists.
  rpc MakeFolder(MakeFolderRequest) returns (MakeFolderResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc Copy(CopyRequest) returns (CopyResponse);
  // Moves to the Trash.
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Protect(ProtectRequest) returns (ProtectResponse);
  rpc Unprotect(UnprotectRequest) returns (UnprotectResponse);
  rpc ListProtected(ListProtectedRequest) returns (ListProtectedResponse);
  // Sends a folder's listing, then again each time it changes, while the
  // client stays (PLAN.md §15: polled every 2 s, which sees changes on every
  // Host, a Windows Shared Folder included).
  rpc Watch(WatchRequest) returns (stream WatchResponse);

  // Sensitive System Files (M8.5). In Root Mode Write, MakeFolder, Move, Copy
  // and Delete refuse to change one unless confirm_sensitive is set
  // (FailedPrecondition, with a SensitivePath detail). A confirmed write
  // keeps the version it replaces, the last five per file.
  //
  // CheckSensitive runs the file's own checker, where it has one, on content
  // about to be saved: visudo for sudoers, sshd -t for sshd_config, findmnt
  // --verify for fstab.
  rpc CheckSensitive(CheckSensitiveRequest) returns (CheckSensitiveResponse);
  rpc ListSensitiveBackups(ListSensitiveBackupsRequest) returns (ListSensitiveBackupsResponse);
  // Puts a kept version back; itself a confirmed write, so the version it
  // replaces is kept in turn.
  rpc RestoreSensitiveBackup(RestoreSensitiveBackupRequest) returns (RestoreSensitiveBackupResponse);
}

// SensitivePath is the detail on a refused change to a Sensitive System File.
message SensitivePath {
  string path = 1;
  // What can go wrong, in a sentence.
  string reason = 2;
}

message CheckSensitiveRequest {
  string path = 1;
  bytes content = 2;
}
message CheckSensitiveResponse {
  // The check that ran, e.g. "visudo -c"; empty when the file has none.
  string checker = 1;
  bool passed = 2;
  // What the checker printed.
  string output = 3;
  // The file has a check, but its program isn't installed.
  bool unavailable = 4;
}

message SensitiveBackup {
  string id = 1;
  google.protobuf.Timestamp saved_at = 2;
  int64 size = 3;
}
message ListSensitiveBackupsRequest {
  string path = 1;
}
message ListSensitiveBackupsResponse {
  // Newest first.
  repeated SensitiveBackup backups = 1;
}
message RestoreSensitiveBackupRequest {
  string path = 1;
  string id = 2;
}
message RestoreSensitiveBackupResponse {}

message WatchRequest {
  string path = 1;
}
message WatchResponse {
  // The whole listing, as List returns it.
  repeated FileInfo entries = 1;
}

message FileInfo {
  string path = 1;
  string name = 2;
  bool dir = 3;
  bool symlink = 4;
  string link_target = 5;
  int64 size = 6;
  uint32 mode = 7;
  google.protobuf.Timestamp modified_at = 8;
  bool protected = 9;
  // Why the entry is protected, for Finder's lock badge and its menu:
  // "user" (locked with 🔒, so it can be unlocked), "default" (a built-in
  // Protected Path), "inherited" (inside one of those), or "" when it is not
  // protected at all.
  string protect_source = 10;
  // Whether the Realm's user may write it (for a folder, add to it), checked
  // as that user (M8.4). Code opens a file that isn't writable read-only. AOS's
  // own state is never writable here, even to root.
  bool writable = 11;
  // In Root Mode, what can go wrong changing this Sensitive System File (M8.5);
  // empty for any other file, and always in Standard Mode.
  string sensitive_reason = 12;
}

message ListRequest {
  string path = 1;
}
message ListResponse {
  repeated FileInfo entries = 1;
}

message StatRequest {
  string path = 1;
}
message StatResponse {
  FileInfo info = 1;
}

message ReadRequest {
  string path = 1;
  int64 offset = 2;
  // 0 reads up to 1 MiB.
  int64 limit = 3;
}
message ReadResponse {
  bytes content = 1;
  bool eof = 2;
}

message WriteRequest {
  string path = 1;
  bytes content = 2;
  bool overwrite = 3;
  // Changes a Sensitive System File in Root Mode (M8.5).
  bool confirm_sensitive = 4;
}
message WriteResponse {}

message MakeFolderRequest {
  string path = 1;
  bool confirm_sensitive = 2;
}
message MakeFolderResponse {}

message MoveRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
  bool confirm_sensitive = 4;
}
message MoveResponse {}

message CopyRequest {
  string source = 1;
  string destination = 2;
  bool overwrite = 3;
  bool confirm_sensitive = 4;
}
message CopyResponse {}

message DeleteRequest {
  string path = 1;
  bool confirm_sensitive = 2;
}
message DeleteResponse {
  TrashItem item = 1;
}

message ProtectRequest {
  string path = 1;
}
message ProtectResponse {}

message UnprotectRequest {
  string path = 1;
}
message UnprotectResponse {}

message ListProtectedRequest {}
message ListProtectedResponse {
  message Entry {
    string path = 1;
    // default | user | pattern
    string source = 2;
    // Whether Landlock enforces it, or policy checks only.
    bool kernel = 3;
  }
  repeated Entry entries = 1;
}

service TrashService {
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse);
  rpc Restore(RestoreRequest) returns (RestoreResponse);
  // Only the user can empty the Trash: refused for Agent callers.
  rpc Empty(EmptyRequest) returns (EmptyResponse);
}

message TrashItem {
  // Opaque id: the Trash folder plus the entry name.
  string id = 1;
  string original_path = 2;
  google.protobuf.Timestamp deleted_at = 3;
  int64 size = 4;
  bool dir = 5;
}

message ListTrashRequest {}
message ListTrashResponse {
  repeated TrashItem items = 1;
}

message RestoreRequest {
  string id = 1;
}
message RestoreResponse {
  string path = 1;
}

message EmptyRequest {}
message EmptyResponse {
  int32 removed = 1;
}

// ---------------------------------------------------------------- Sessions (I/O over /ws/session/<id>)

service SessionService {
  // Creates a User Session: unconfined, as aos.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
}

message SessionInfo {
  string id = 1;
  // Empty for User Sessions.
  string task_id = 2;
  bool agent = 3;
  int32 pid = 4;
  google.protobuf.Timestamp created_at = 5;
  // An Agent Session whose Task has ended, kept a while so a viewer can still
  // replay what it showed. It takes no input.
  bool ended = 6;
  // The folder the shell started in; set on CreateSession's response only.
  string cwd = 7;
}

message CreateSessionRequest {
  uint32 cols = 1;
  uint32 rows = 2;
  // The folder to start in, such as a Code Workspace's (M8.6). The shell
  // starts there only if the Realm's user can enter it, and in the home
  // folder otherwise; SessionInfo.cwd says which. Empty is the home folder.
  string cwd = 3;
}
message CreateSessionResponse {
  SessionInfo session = 1;
}

message ListSessionsRequest {}
message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message CloseSessionRequest {
  string id = 1;
}
message CloseSessionResponse {}

// ---------------------------------------------------------------- Software (PLAN.md §11)

service SoftwareService {
  // Software the Install Ledger says the Machine has (packages installed through AOS).
  rpc ListPackages(ListPackagesRequest) returns (ListPackagesResponse);
  // The Ledger's operations, newest first.
  rpc ListLedger(ListLedgerRequest) returns (ListLedgerResponse);
  rpc ListCheckpoints(ListCheckpointsRequest) returns (ListCheckpointsResponse);
  rpc CreateCheckpoint(CreateCheckpointRequest) returns (CreateCheckpointResponse);
  // Returns software, /etc and Services to a Checkpoint. A "Before Restore"
  // Checkpoint is taken first, so the Restore itself can be undone.
  rpc RestoreCheckpoint(RestoreCheckpointRequest) returns (RestoreCheckpointResponse);
}

message ListPackagesRequest {}
message ListPackagesResponse {
  repeated Package packages = 1;
}

message ListLedgerRequest {
  int32 limit = 1;
  // Operations with id < before_id; 0 starts at the newest.
  int64 before_id = 2;
}
message ListLedgerResponse {
  repeated LedgerOp ops = 1;
}

message ListCheckpointsRequest {}
message ListCheckpointsResponse {
  repeated Checkpoint checkpoints = 1;
}

message CreateCheckpointRequest {
  string name = 1;
}
message CreateCheckpointResponse {
  Checkpoint checkpoint = 1;
}

message RestoreCheckpointRequest {
  string id = 1;
}
message RestoreCheckpointResponse {
  // The Restore as recorded in the Ledger.
  LedgerOp op = 1;
  // The Checkpoint that undoes this Restore.
  Checkpoint before = 2;
  // Anything that could not be restored exactly.
  repeated string notes = 3;
}

// ---------------------------------------------------------------- Services (PLAN.md §12)

service SupervisorService {
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse);
  rpc StartService(StartServiceRequest) returns (StartServiceResponse);
  rpc StopService(StopServiceRequest) returns (StopServiceResponse);
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse);
  rpc RemoveService(RemoveServiceRequest) returns (RemoveServiceResponse);
  // The Service's recent output, then new output while follow is set.
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
}

message ListServicesRequest {}
message ListServicesResponse {
  repeated ServiceInfo services = 1;
  // Every program listening on a TCP port, Service or not.
  repeated Listener listeners = 2;
}

message StartServiceRequest {
  string name = 1;
}
message StartServiceResponse {
  ServiceInfo service = 1;
}

message StopServiceRequest {
  string name = 1;
}
message StopServiceResponse {
  ServiceInfo service = 1;
}

message RestartServiceRequest {
  string name = 1;
}
message RestartServiceResponse {
  ServiceInfo service = 1;
}

message RemoveServiceRequest {
  string name = 1;
}
message RemoveServiceResponse {}

message StreamLogsRequest {
  string name = 1;
  bool follow = 2;
  // How much recent output to send first; 0 sends up to 64 KiB.
  int32 tail_bytes = 3;
}
message StreamLogsResponse {
  bytes data = 1;
}

// ---------------------------------------------------------------- Settings

service SettingsService {
  // Accepted Memory and the Agents' proposals.
  rpc ListMemory(ListMemoryRequest) returns (ListMemoryResponse);
  // Saves an entry the user wrote.
  rpc AddMemory(AddMemoryRequest) returns (AddMemoryResponse);
  // Accepts an Agent's proposal.
  rpc AcceptMemory(AcceptMemoryRequest) returns (AcceptMemoryResponse);
  // Removes an entry or rejects a proposal.
  rpc ForgetMemory(ForgetMemoryRequest) returns (ForgetMemoryResponse);

  // The Desktop's saved layout: window positions, theme and wallpaper. The
  // server stores it as an opaque JSON blob the client owns (PLAN.md §4.3).
  rpc GetDesktopState(GetDesktopStateRequest) returns (GetDesktopStateResponse);
  rpc SaveDesktopState(SaveDesktopStateRequest) returns (SaveDesktopStateResponse);

  // The settings that can change while AOS runs (PLAN.md §6.4), each with
  // where its value comes from.
  rpc Get(GetSettingsRequest) returns (GetSettingsResponse);
  // Saves one setting. An empty value removes the saved one, so the
  // environment's value, or the default, applies again.
  rpc Update(UpdateSettingRequest) returns (UpdateSettingResponse);

  // Replaces the OpenAI API key (PLAN.md §7.7). It wins over the key from
  // .env, across restarts, until ClearApiKey. Only a hint (sk-…abcd) of any
  // key ever leaves aosd.
  rpc SetApiKey(SetApiKeyRequest) returns (SetApiKeyResponse);
  // Goes back to the key from .env.
  rpc ClearApiKey(ClearApiKeyRequest) returns (ClearApiKeyResponse);
}

message SetApiKeyRequest {
  string key = 1;
}
message SetApiKeyResponse {
  string hint = 1;
}

message ClearApiKeyRequest {}
message ClearApiKeyResponse {
  // The hint of the key now in use, or "" when .env has none.
  string hint = 1;
}

message Setting {
  // Runtime keys: model | reasoning_effort | autonomy | max_tasks | max_retries
  // | task_cost_limit_usd | daily_cost_limit_usd | trash_retention_days |
  // trash_max_gb. Startup-only keys: base_url | require_landlock.
  string key = 1;
  string value = 2;
  // default | env | settings (saved in config.yml, ADR-0010)
  string source = 3;
  // The environment variable that also sets it (Compose bootstrap), such as
  // AOS_MAX_TASKS.
  string env = 4;
  // The value without the saved one: the environment's, or the default.
  string fallback = 5;
  // A startup-only key whose saved value is not yet in force; a restart applies
  // it.
  bool pending_restart = 6;
}

message GetSettingsRequest {}
message GetSettingsResponse {
  repeated Setting settings = 1;
  // The model catalogue (M6.16), for the Settings dropdowns: which models to
  // offer and, per model, which reasoning efforts it accepts. Open, not an
  // allow-list — the model field is still free text, so an unlisted model stays
  // usable. Empty when the catalogue is unavailable.
  repeated ModelChoice models = 2;
}

// ModelChoice is one entry of the model catalogue as System Settings shows it.
message ModelChoice {
  string id = 1;
  string label = 2;
  // The reasoning efforts this model accepts; any other value is an HTTP 400.
  repeated string efforts = 3;
  // What OpenAI uses when the request omits an effort; "" when undocumented.
  string default_effort = 4;
  // The model aosd defaults to.
  bool is_default = 5;
}

message UpdateSettingRequest {
  string key = 1;
  string value = 2;
}
message UpdateSettingResponse {
  Setting setting = 1;
}

message ListMemoryRequest {}
message ListMemoryResponse {
  repeated Memory memories = 1;
}

message AddMemoryRequest {
  string text = 1;
}
message AddMemoryResponse {
  Memory memory = 1;
}

message AcceptMemoryRequest {
  string id = 1;
}
message AcceptMemoryResponse {
  Memory memory = 1;
}

message ForgetMemoryRequest {
  string id = 1;
}
message ForgetMemoryResponse {}

message GetDesktopStateRequest {}
message GetDesktopStateResponse {
  // The last saved layout as JSON, or "" if nothing has been saved yet.
  string state = 1;
}

message SaveDesktopStateRequest {
  string state = 1;
  // The saving tab's own id, echoed back in the DesktopStateChanged event so
  // that tab can ignore it.
  string origin = 2;
}
message SaveDesktopStateResponse {}

// ---------------------------------------------------------------- System

service SystemService {
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Audit(AuditRequest) returns (AuditResponse);
  // Model usage per day over every model, for the Agent app's chart.
  rpc Usage(UsageRequest) returns (UsageResponse);
  // The Machine's CPU, memory, disks and network, sampled when asked:
  // Activity Monitor polls it while open, so an idle aosd samples nothing.
  rpc Metrics(MetricsRequest) returns (MetricsResponse);
  // The Machine's processes, read from /proc when asked (Activity Monitor
  // polls it while open).
  rpc Processes(ProcessesRequest) returns (ProcessesResponse);
  // Notifications not yet dismissed, newest first, so they survive a reload.
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc DismissNotification(DismissNotificationRequest) returns (DismissNotificationResponse);
  // Restart aosd itself (M7.3). The Daemon replies, then restarts out of band —
  // under systemd through `systemctl restart --no-block aos`, under Compose by
  // draining and exiting for `restart: unless-stopped` to bring the container
  // back. The usual drain (M6.2) runs first, so running Tasks stop cleanly and
  // are marked interrupted, not lost. Never an Agent: the control socket's §7.5
  // guard already refuses Agent-confined callers. The client confirms the
  // restart by watching Info's boot_id change.
  rpc Restart(RestartRequest) returns (RestartResponse);
  // SetRootMode turns Root Mode on or off (M7.7) — the only way to change the
  // root_mode key, which SettingsService.Update refuses. Turning it on needs the
  // Desktop account's password (verified like sign-in, M6.3); turning it off
  // needs none, since it lowers privilege. It is refused while any Task is
  // Queued, Running or AwaitingUser, and while any Code window has a Workspace
  // open (M8.13), since the restart would drop its unsaved files
  // (FailedPrecondition, detail RootModeBlocked, listing both), before the
  // password is even checked, so a wrong-password try is never spent on a
  // switch that cannot happen. A wrong password is Unauthenticated (detail
  // RootModeAttempt with the attempts left); five wrong in fifteen minutes lock
  // the switch for fifteen (ResourceExhausted, detail RootModeLockout with the
  // unlock time). On success it audits the switch in the Realm it is made from
  // and restarts (M7.3) into the new Realm. Over the control socket the caller
  // has already proven root, so no password is asked (M7.11); an Agent-confined
  // caller is refused by the socket's §7.5 guard.
  rpc SetRootMode(SetRootModeRequest) returns (SetRootModeResponse);
  // ClearRootHistory erases Root Mode's own history (M7.12): the Root database
  // (its Tasks, Audit Log, chats and the rest) and its read_output blobs, so the
  // next Root start begins empty. It runs only in Root Mode — refused with
  // FailedPrecondition from Standard, where there is nothing of Root's to reach.
  // Like the Realm switch it is refused while any Task is Queued, Running or
  // AwaitingUser (FailedPrecondition, detail RootModeBlocked), so nothing is
  // writing to the database as it is deleted. It audits the clear in Root's log
  // (about to be erased) and restarts (M7.3) back into Root Mode, which recreates
  // the empty database and outputs. What root already did to the server's files
  // and packages is real and stays — only AOS's record of it is cleared. Over the
  // control socket the caller has already proven root (§7.5); an Agent-confined
  // caller is refused by the socket's guard.
  rpc ClearRootHistory(ClearRootHistoryRequest) returns (ClearRootHistoryResponse);
}

message RestartRequest {}
message RestartResponse {}

message ClearRootHistoryRequest {}
message ClearRootHistoryResponse {}

message SetRootModeRequest {
  // The Realm to switch to: true enters Root Mode, false leaves it.
  bool enabled = 1;
  // The Desktop account's password, required only when entering Root Mode over
  // the network; ignored when leaving, and unused over the control socket.
  string password = 2;
}
message SetRootModeResponse {}

// RootModeBlocked is the FailedPrecondition detail on SetRootMode: the Tasks that
// must finish or be cancelled, and the Code Workspaces that must be closed
// (M8.13), before the Realm can be switched. ClearRootHistory is refused for
// Tasks only, so it lists no Workspaces.
message RootModeBlocked {
  repeated BlockingTask tasks = 1;
  repeated BlockingWorkspace workspaces = 2;
}

// BlockingWorkspace names one open Code Workspace, in any of the Desktop's tabs,
// that blocks a Realm switch (M8.13), with its window's unsaved files.
message BlockingWorkspace {
  string id = 1;
  // The Workspace's folder.
  string path = 2;
  // Absolute paths of the window's files with unsaved edits, sorted.
  repeated string unsaved = 3;
}

// BlockingTask names one Task that blocks a Realm switch, enough for the Desktop
// to show it with an Open link (M7.9).
message BlockingTask {
  string id = 1;
  string title = 2;
  TaskState state = 3;
}

// RootModeAttempt is the Unauthenticated detail after a wrong Root Mode password.
message RootModeAttempt {
  int32 attempts_left = 1;
}

// RootModeLockout is the ResourceExhausted detail when too many wrong passwords
// have locked the Root Mode switch.
message RootModeLockout {
  google.protobuf.Timestamp until = 1;
}

message ListNotificationsRequest {}
message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message DismissNotificationRequest {
  string id = 1;
  // Dismiss every notification instead; id is then ignored.
  bool all = 2;
}
message DismissNotificationResponse {}

message ProcessesRequest {}
message ProcessesResponse {
  repeated ProcessInfo processes = 1;
}

message ProcessInfo {
  int32 pid = 1;
  int32 ppid = 2;
  string user = 3;
  // The program's name, and its command line ("[name]" when it has none).
  string name = 4;
  string command = 5;
  // Share of one CPU since the previous call, so it can pass 100 on several
  // CPUs; cpu_known is false the first time a process is seen.
  double cpu_percent = 6;
  bool cpu_known = 7;
  uint64 rss_bytes = 8;
  // Whether the process runs with no_new_privs, as every Agent process does:
  // Agent Sessions, their commands and the confined file workers.
  bool confined = 9;
  // The Task whose Agent started the process, or one of its ancestors, its
  // process group or its session; empty for anything else.
  string task_id = 10;
  google.protobuf.Timestamp started_at = 11;
}

message MetricsRequest {}
message MetricsResponse {
  // The busy share of the CPU the Machine may use, 0 to 100, since the
  // previous call; cpu_known is false on the first.
  double cpu_percent = 1;
  bool cpu_known = 2;
  // CPUs the Machine may use: its cgroup's quota, or the Host's CPUs.
  double cpus = 3;
  uint64 memory_used_bytes = 4;
  // The Machine's memory limit, or the Host's memory when it has none.
  uint64 memory_total_bytes = 5;
  repeated DiskUsage disks = 6;
  // Since the Machine started, over every interface but loopback; the
  // client works out rates from successive samples.
  uint64 net_rx_bytes = 7;
  uint64 net_tx_bytes = 8;
}

message DiskUsage {
  // A folder on the file system, such as /home/aos or /shared.
  string path = 1;
  uint64 total_bytes = 2;
  uint64 used_bytes = 3;
  uint64 available_bytes = 4;
}

message UsageRequest {
  // How many days back, today included: 1 to 366; 0 means 30.
  int32 days = 1;
}
message UsageResponse {
  // Oldest first; a day without usage has zeros.
  repeated DailyUsage days = 1;
}

message DailyUsage {
  // YYYY-MM-DD, in the Machine's time zone.
  string day = 1;
  Usage usage = 2;
}

message InfoRequest {}
message InfoResponse {
  string mode = 1;
  string version = 2;
  int32 landlock_abi = 3;
  // present | empty | missing
  string api_key = 4;
  string model = 5;
  Autonomy autonomy = 6;
  int32 max_tasks = 7;
  ReplayStatus replay = 8;
  // Today's model usage, all Tasks.
  Usage today = 9;
  // 0 means no limit.
  double task_cost_limit_usd = 10;
  double daily_cost_limit_usd = 11;
  // Whether prices.yaml has prices for the configured model.
  bool prices_known = 12;
  int32 max_retries = 13;
  // The key as System Settings shows it, such as sk-…abcd; "" without a key.
  string api_key_hint = 14;
  // settings | env: where the key in use came from.
  string api_key_source = 15;
  // The Browser app can run (ui Mode, INCLUDE_BROWSER=true, and the image has
  // the browser; PLAN.md M5.2).
  bool browser = 16;
  // Why the Browser can't run although INCLUDE_BROWSER=true, such as an image
  // built before it was set; "" otherwise.
  string browser_unavailable = 17;
  // Whether the Machine is running in Root Mode (the Root Realm, M7). The
  // Desktop shows the ROOT badge and the CLI prints the Realm from this.
  bool root_mode = 18;
  // A random id fixed for this run of aosd, new on every start. A restart
  // (M7.3) is confirmed by watching this change.
  string boot_id = 19;
}

message AuditRequest {
  string task_id = 1;
  int32 limit = 2;
  // Entries with id < before_id; 0 starts at the newest.
  int64 before_id = 3;
}
message AuditResponse {
  repeated AuditEntry entries = 1;
}

// ---------------------------------------------------------------- Code

// CodeService serves Code, the Desktop's code editor (PLAN.md M8). Everything
// in it acts with the Realm's rights, like FileService: as aos in Standard Mode,
// as root in Root Mode. Agents never reach it: the control socket's §7.5 guard
// refuses Agent-confined callers, and they hold no Desktop token.
//
// A Code window holds no stream of its own. Browsers allow six connections to
// aosd across all the Desktop's tabs, so a Workspace rides its tab's
// EventService subscription: it belongs to that subscription, its changes
// arrive on it as WorkspaceChanged events, and it closes when the subscription
// ends. A tab whose subscription restarts opens its Workspaces again.
service CodeService {
  // OpenWorkspace opens a folder as a Code window's Workspace, owned by the
  // tab's subscription. The Workspace's changes then arrive on that
  // subscription as WorkspaceChanged events: first how it is watched, then
  // what appears, changes or goes under it. They travel on another connection,
  // so one may arrive before this response does.
  //
  // A folder the Realm's user cannot read is refused (PermissionDenied), and a
  // path that is not a folder is InvalidArgument. An unknown or ended
  // subscription is NotFound; more than 32 Workspaces in one tab is
  // ResourceExhausted. While any Workspace is open, the Realm cannot be
  // switched (M8.13).
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (OpenWorkspaceResponse);
  // CloseWorkspace closes a Workspace when its window closes. NotFound once
  // it is already closed.
  rpc CloseWorkspace(CloseWorkspaceRequest) returns (CloseWorkspaceResponse);
  // ReportDirty replaces the unsaved files of an open Workspace, which the
  // Realm switch lists when it refuses (M8.13). NotFound once it is closed.
  rpc ReportDirty(ReportDirtyRequest) returns (ReportDirtyResponse);
  // FindFiles is Quick Open (M8.7): the Workspace's files that fuzzily match
  // a query, best first. The files are listed as the Realm's user once,
  // honouring .gitignore, and kept current from the Workspace's watch.
  rpc FindFiles(FindFilesRequest) returns (FindFilesResponse);
  // SearchText is Find in Files (M8.7): matching lines under the Workspace,
  // file by file as they are found, then a summary. ripgrep runs as the
  // Realm's user when installed, AOS's own search otherwise; both honour
  // .gitignore and skip binary files. A regular expression that does not
  // compile is InvalidArgument.
  rpc SearchText(SearchTextRequest) returns (stream SearchTextResponse);

  // Navigation (M8.8), from a symbol index of the Workspace that
  // universal-ctags builds as the Realm's user: in memory, built at the first
  // question and then kept current from the Workspace's watch. It is by name,
  // not by type: two Run methods are both offered. Past 20 000 files only the
  // folders of the files asked from are indexed (IndexState.partial). Without
  // universal-ctags these are FailedPrecondition, saying to install it.
  //
  // Definition: where a name is defined, nearest to the file asked from first.
  rpc Definition(DefinitionRequest) returns (DefinitionResponse);
  // References: the name's whole-word, case-sensitive uses in files of the
  // same language as the file asked from. A text search, so it needs no ctags.
  rpc References(ReferencesRequest) returns (ReferencesResponse);
  // DocumentSymbols: a file's symbols as last saved, in order (⌘⇧O, Outline).
  rpc DocumentSymbols(DocumentSymbolsRequest) returns (DocumentSymbolsResponse);
  // WorkspaceSymbols: symbols whose names fuzzily match a query (⌘T), and
  // completion.
  rpc WorkspaceSymbols(WorkspaceSymbolsRequest) returns (WorkspaceSymbolsResponse);
}

message Symbol {
  string name = 1;
  // ctags' kind, such as "func", "method", "class", "struct", "const".
  string kind = 2;
  // Absolute.
  string path = 3;
  // From 1; end_line is 0 when ctags does not know it.
  uint32 line = 4;
  uint32 end_line = 5;
  // What it is inside, such as "main.Server" for a Go method.
  string scope = 6;
  string signature = 7;
  string language = 8;
}

// IndexState is how much of the Workspace the symbol index covers.
message IndexState {
  // Files with symbols, and files in the Workspace.
  uint32 files = 1;
  uint32 total = 2;
  // The Workspace has more than 20 000 files: only the folders of files
  // asked from are indexed.
  bool partial = 3;
}

message DefinitionRequest {
  string workspace_id = 1;
  string name = 2;
  // The file asked from, absolute: nearer definitions come first, and one
  // in its language is preferred.
  string path = 3;
}
message DefinitionResponse {
  repeated Symbol symbols = 1;
  IndexState index = 2;
}

message ReferencesRequest {
  string workspace_id = 1;
  string name = 2;
  // The file asked from, absolute; its language picks the files searched.
  string path = 3;
}
message ReferencesResponse {
  repeated TextFileMatches files = 1;
  // It stopped at 1000 lines.
  bool truncated = 2;
}

message DocumentSymbolsRequest {
  string workspace_id = 1;
  // Absolute.
  string path = 2;
}
message DocumentSymbolsResponse {
  repeated Symbol symbols = 1;
  IndexState index = 2;
}

message WorkspaceSymbolsRequest {
  string workspace_id = 1;
  string query = 2;
  // 0 means 100; more than 500 is 500.
  uint32 limit = 3;
  // The file asked from, absolute, if any: past 20 000 files its folder is
  // indexed first.
  string path = 4;
}
message WorkspaceSymbolsResponse {
  repeated Symbol symbols = 1;
  IndexState index = 2;
}

message FindFilesRequest {
  string workspace_id = 1;
  // Characters to find in order in a file's path; case and spaces are
  // ignored. Empty lists the first files by path.
  string query = 2;
  // At most this many; 0 means 50, and more than 500 is 500.
  uint32 limit = 3;
}
message FindFilesResponse {
  repeated FoundFile files = 1;
  // How many files the Workspace has, and whether there were more than Code
  // lists (100 000).
  uint32 total = 2;
  bool truncated = 3;
}
message FoundFile {
  // Absolute.
  string path = 1;
  // Which characters matched, as UTF-16 offsets into the path relative to
  // the Workspace's root.
  repeated uint32 positions = 2;
}

message SearchTextRequest {
  string workspace_id = 1;
  string query = 2;
  bool regex = 3;
  bool case_sensitive = 4;
  // gitignore-style globs relative to the root, such as *.go or src/**: only
  // files matching one of include, and none of exclude.
  repeated string include = 5;
  repeated string exclude = 6;
}
message SearchTextResponse {
  repeated TextFileMatches files = 1;
  // Set on the last message only.
  SearchTextSummary summary = 2;
}
message TextFileMatches {
  // Absolute.
  string path = 1;
  repeated TextMatch matches = 2;
}
message TextMatch {
  // From 1.
  uint32 line = 1;
  // The line, trimmed, and cut to 400 characters around the first match
  // with "…" where it was cut.
  string text = 2;
  // Where the query matched in text, as UTF-16 offsets.
  repeated TextRange ranges = 3;
}
message TextRange {
  uint32 start = 1;
  uint32 end = 2;
}
message SearchTextSummary {
  uint32 files = 1;
  uint32 matches = 2;
  // The search stopped at 2000 matching lines.
  bool truncated = 3;
  // "ripgrep", or "built-in" on a Machine without it.
  string engine = 4;
}

message OpenWorkspaceRequest {
  // The tab's EventService subscription (SubscribeResponse.subscription_id).
  string subscription_id = 1;
  // A folder; ~ and relative paths start at the Realm's home, as in FileService.
  string path = 2;
}
message OpenWorkspaceResponse {
  string id = 1;
  // The folder, absolute and clean.
  string root = 2;
  // The Realm it was opened in.
  bool root_mode = 3;
}

message CloseWorkspaceRequest {
  string workspace_id = 1;
}
message CloseWorkspaceResponse {}

message ReportDirtyRequest {
  string workspace_id = 1;
  // Absolute paths of every file with unsaved edits in the window; empty when
  // all are saved.
  repeated string paths = 2;
}
message ReportDirtyResponse {}

// WorkspaceChanged is sent only to the subscription that opened the Workspace.
message WorkspaceChanged {
  string workspace_id = 1;
  // What appeared, changed or went under the root, in one burst. A path
  // replaced by a rename (an editor's atomic save) comes as CREATED even when
  // the client already has it: treat that as CHANGED.
  repeated FileChange changes = 2;
  // Set when how the Workspace is watched changes, the first time included.
  WorkspaceWatch watch = 3;
}

message FileChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_CHANGED = 2;
    KIND_DELETED = 3;
    // Changes under path were missed (the kernel dropped events, or the watch
    // moved to polling): list it again.
    KIND_RESCAN = 4;
  }
  Kind kind = 1;
  string path = 2;
  bool dir = 3;
}

message WorkspaceWatch {
  enum State {
    STATE_UNSPECIFIED = 0;
    // inotify: changes arrive as they happen.
    STATE_LIVE = 1;
    // The tree is walked every 2 s: it has more folders than one Workspace may
    // watch live, or the Machine's inotify limit was reached. `reason` says which.
    STATE_POLLING = 2;
    // No more changes will come, such as after the folder itself was deleted
    // or moved; the Workspace stays open until its window closes it.
    STATE_STOPPED = 3;
  }
  State state = 1;
  string reason = 2;
}
